name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and package release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      commit_oid: ${{ steps.revision.outputs.commit_oid }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Validate version and release revision
        id: revision
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const {version} = JSON.parse(fs.readFileSync("package.json", "utf8")); if (process.env.RELEASE_TAG !== "v" + version) throw new Error("Release tag must match package.json version");'
          git merge-base --is-ancestor HEAD origin/main
          verified=$(gh api "repos/$GITHUB_REPOSITORY/commits/$(git rev-parse HEAD)" --jq '.commit.verification.verified')
          test "$verified" = true
          echo "commit_oid=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run verify
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - name: Package static site
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release
          cd dist
          zip -qr "../release/exchange-converter-$RELEASE_TAG.zip" .
          cd ../release
          sha256sum "exchange-converter-$RELEASE_TAG.zip" > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-files
          path: release/
          retention-days: 1
  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: release
      - name: Publish release notes and downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ needs.build.outputs.commit_oid }}
        run: |
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')
          if [ "$tag_sha" != "$RELEASE_SHA" ]; then
            echo 'The release tag moved after validation; refusing to publish mismatched artifacts.'
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "release/exchange-converter-$RELEASE_TAG.zip" release/SHA256SUMS.txt \
            --verify-tag --generate-notes
