name: Delivery

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 17 * * 3'
  workflow_dispatch:
    inputs:
      update_rates:
        description: Fetch new default exchange rates before deploying
        type: boolean
        default: true

permissions:
  contents: read

# A data commit and its deployment must finish together. A later run still
# checks the current branch head before publishing its artifact.
concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh default data
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.update_rates))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      pull-requests: write
      actions: write
      statuses: write
    outputs:
      commit_oid: ${{ steps.publish.outputs.commit_oid }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run data:update
      - run: npm run verify
      - name: Publish data through a checked pull request
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/update-rates-pr.mjs

  build:
    name: Build and test site
    needs: refresh
    if: >-
      always() && !failure() && !cancelled() &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    outputs:
      commit_oid: ${{ steps.revision.outputs.commit_oid }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.refresh.outputs.commit_oid || github.sha }}
          persist-credentials: false
      - name: Record the revision being built
        id: revision
        run: echo "commit_oid=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Require a verified commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verified=$(gh api "repos/$GITHUB_REPOSITORY/commits/$(git rev-parse HEAD)" --jq '.commit.verification.verified')
          test "$verified" = true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: npm run verify
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          retention-days: 1
      - name: Retain browser failure report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Publish GitHub Pages
    needs: build
    if: always() && !cancelled() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ensure this is still the current main revision
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ needs.build.outputs.commit_oid }}
        run: |
          latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$latest_sha" = "$BUILD_SHA" ]; then
            echo 'is_current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'is_current=false' >> "$GITHUB_OUTPUT"
            echo 'A newer main revision exists; its delivery run will publish the site.'
          fi
      - name: Deploy tested artifact
        if: steps.current.outputs.is_current == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
